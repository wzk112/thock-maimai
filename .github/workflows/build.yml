name: Build and check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build
        run: |
          cmake -S windows -B build -A x64
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare Windows audio services and isolated single-file folder
        run: |
          Get-Service AudioEndpointBuilder,Audiosrv | ForEach-Object {
            if ($_.Status -ne 'Running') { Start-Service $_.Name -ErrorAction Continue }
          }
          Get-Service AudioEndpointBuilder,Audiosrv | Format-Table
          Get-CimInstance Win32_SoundDevice | Select-Object Name,Status
          New-Item -ItemType Directory -Force 'build/standalone/独立 测试'
          Copy-Item 'build/Release/Thock maimai.exe' 'build/standalone/独立 测试/Thock maimai.exe'
          if ((Get-ChildItem 'build/standalone/独立 测试').Count -ne 1) { throw 'Single-file test must start with only the EXE' }
      - name: Validate Direct3D pixels, transparency, audio decoding and overlay
        run: |
          $p = Start-Process -FilePath 'build/standalone/独立 测试/Thock maimai.exe' -ArgumentList '--self-test' -PassThru
          if (!$p.WaitForExit(90000)) { $p.Kill(); throw 'Self-test timed out' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path 'build/standalone/独立 测试/error.txt') { Get-Content 'build/standalone/独立 测试/error.txt' }
            throw "Self-test failed: $($p.ExitCode)"
          }
          Get-Content 'build/standalone/独立 测试/self-test.json'
      - name: Exercise the running app with Windows keyboard input
        run: |
          $p = Start-Process -FilePath 'build/standalone/独立 测试/Thock maimai.exe' -ArgumentList '--integration-test' -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw 'Integration test timed out' }
          if (Test-Path 'build/standalone/独立 测试/integration-test.json') { Get-Content 'build/standalone/独立 测试/integration-test.json' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path 'build/standalone/独立 测试/error.txt') { Get-Content 'build/standalone/独立 测试/error.txt' }
            throw "Integration test failed: $($p.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-x64
          path: |
            build/Release/Thock maimai.exe
            build/standalone/独立 测试/*.json
            build/standalone/独立 测试/*.png
            build/standalone/独立 测试/error.txt
          if-no-files-found: warn
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS source
        run: xcodebuild -project Thock.xcodeproj -scheme Thock -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build
      - name: Package macOS app
        run: |
          codesign --force --deep --sign - 'build/Build/Products/Release/Thock maimai.app'
          codesign --verify --deep --strict 'build/Build/Products/Release/Thock maimai.app'
          ditto -c -k --sequesterRsrc --keepParent 'build/Build/Products/Release/Thock maimai.app' build/Thock-maimai-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-arm64
          path: build/Thock-maimai-macOS-arm64.zip
